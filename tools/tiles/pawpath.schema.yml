# GENERATED by tools/tiles/generateSchema.ts from src/data/layers.ts.
# Do not edit by hand: run `npm run tiles:schema`.
schema_name: PawPath
schema_description: Dog-walk layers from OpenStreetMap. GENERATED from src/data/layers.ts by tools/tiles/generateSchema.ts — do not edit by hand.
attribution: <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>
args:
  osm_path:
    description: Input .osm.pbf file
    default: data/input.osm.pbf
  bathing_path:
    description: GeoJSON for eea_bathing
    default: data/bathing-waters.geojson
  maxzoom: 14
sources:
  osm:
    type: osm
    local_path: ${ args.osm_path }
  eea_bathing:
    type: geojson
    local_path: ${ args.bathing_path }
layers:
  - id: shade
    features:
      - source: osm
        geometry: polygon
        min_zoom: 11
        include_when:
          __any__:
            - natural: wood
            - landuse: forest
            - natural: scrub
        attributes: &a1
          - key: level
            value:
              - if:
                  natural: wood
                value: dense
              - if:
                  landuse: forest
                value: dense
              - if:
                  natural: scrub
                value: medium
              - if:
                  natural: tree_row
                value: light
          - key: name
            tag_value: name
          - key: leaf_type
            tag_value: leaf_type
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          natural: tree_row
        attributes: *a1
  - id: offLeash
    features:
      - source: osm
        geometry: polygon
        min_zoom: 11
        include_when:
          __any__:
            - dog: unleashed
            - dog: designated
            - leisure: dog_park
            - dog: leashed
            - dog: no
            - dog: yes
        attributes: &a2
          - key: level
            value:
              - if:
                  dog:
                    - unleashed
                    - designated
                value: off_leash
              - if:
                  dog: leashed
                value: leashed
              - if:
                  dog: no
                value: prohibited
              - if:
                  leisure: dog_park
                value: off_leash_fenced
              - if:
                  dog: yes
                value: allowed_leash_unknown
          - key: name
            tag_value: name
          - key: dog
            tag_value: dog
          - key: leisure
            tag_value: leisure
          - key: barrier
            tag_value: barrier
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          __any__:
            - __all__:
                - dog: unleashed
                - highway: __any__
            - __all__:
                - dog: designated
                - highway: __any__
            - __all__:
                - leisure: dog_park
                - highway: __any__
            - __all__:
                - dog: leashed
                - highway: __any__
            - __all__:
                - dog: no
                - highway: __any__
            - __all__:
                - dog: yes
                - highway: __any__
        attributes: *a2
      - source: osm
        geometry: point
        min_zoom: 11
        include_when:
          __any__:
            - dog: unleashed
            - dog: designated
            - leisure: dog_park
            - dog: leashed
            - dog: no
            - dog: yes
        attributes: *a2
  - id: surface
    features:
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          __all__:
            - highway:
                - path
                - footway
                - track
                - pedestrian
                - cycleway
                - steps
                - living_street
                - residential
                - service
                - unclassified
            - surface:
                - asphalt
                - chipseal
                - tarmac
                - bitumen
                - concrete
                - concrete:plates
                - concrete:lanes
                - paved
                - paving_stones
                - sett
                - cobblestone
                - unhewn_cobblestone
                - bricks
                - paving_stones_lanes
                - metal
                - rubber
                - sand
                - shells
                - gravel
                - fine_gravel
                - pebblestone
                - compacted
                - unpaved
                - ground
                - dirt
                - earth
                - mud
                - grass
                - grass_paver
                - woodchips
                - wood
        attributes:
          - key: level
            value:
              - if:
                  surface:
                    - asphalt
                    - chipseal
                    - tarmac
                    - bitumen
                    - concrete
                    - concrete:plates
                    - concrete:lanes
                    - paved
                    - paving_stones
                    - sett
                    - cobblestone
                    - unhewn_cobblestone
                    - bricks
                    - paving_stones_lanes
                    - metal
                    - rubber
                value: high
              - if:
                  surface:
                    - sand
                    - shells
                    - gravel
                    - fine_gravel
                    - pebblestone
                    - compacted
                    - unpaved
                value: mid
              - if:
                  surface:
                    - ground
                    - dirt
                    - earth
                    - mud
                    - grass
                    - grass_paver
                    - woodchips
                    - wood
                value: low
          - key: surface
            tag_value: surface
          - key: highway
            tag_value: highway
          - key: name
            tag_value: name
  - id: water
    features:
      - source: eea_bathing
        geometry: point
        min_zoom: 11
        include_when:
          bwid: __any__
        attributes:
          - key: level
            value:
              - else: monitored
          - key: bwid
            tag_value: bwid
          - key: name
            tag_value: name
          - key: category
            tag_value: category
          - key: quality
            tag_value: quality
          - key: quality_year
            tag_value: quality_year
          - key: profile
            tag_value: profile
          - key: country
            tag_value: country
  - id: benches
    features:
      - source: osm
        geometry: centroid
        min_zoom: 13
        include_when:
          amenity: bench
        attributes:
          - key: backrest
            tag_value: backrest
          - key: material
            tag_value: material
  - id: waste
    features:
      - source: osm
        geometry: centroid
        min_zoom: 13
        include_when:
          __any__:
            - amenity: waste_basket
            - vending: excrement_bags
            - amenity: dog_waste%
            - amenity: dog_excrement
        attributes:
          - key: level
            value:
              - if:
                  vending: excrement_bags
                value: bag_dispenser
              - if:
                  waste: dog_excrement
                value: dog_bin
              - if:
                  amenity: dog_waste%
                value: dog_bin
              - if:
                  amenity: dog_excrement
                value: dog_bin
              - if:
                  amenity: waste_basket
                value: general
          - key: waste
            tag_value: waste
          - key: vending
            tag_value: vending
  - id: drinkingWater
    features:
      - source: osm
        geometry: centroid
        min_zoom: 13
        include_when:
          __any__:
            - amenity: drinking_water
            - amenity: water_point
        attributes:
          - key: name
            tag_value: name
          - key: bottle
            tag_value: bottle
          - key: dog
            tag_value: dog
  - id: toilets
    features:
      - source: osm
        geometry: centroid
        min_zoom: 13
        include_when:
          amenity: toilets
        attributes:
          - key: name
            tag_value: name
          - key: access
            tag_value: access
          - key: fee
            tag_value: fee
          - key: wheelchair
            tag_value: wheelchair
          - key: opening_hours
            tag_value: opening_hours
          - key: changing_table
            tag_value: changing_table
  - id: walk
    features:
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          highway:
            - path
            - footway
            - pedestrian
            - track
            - bridleway
            - living_street
            - residential
            - service
            - unclassified
            - cycleway
            - steps
            - tertiary
            - tertiary_link
            - secondary
            - secondary_link
            - primary
            - primary_link
        tolerance_at_max_zoom: 0
        min_size_at_max_zoom: 0
        attributes:
          - key: highway
            tag_value: highway
          - key: surface
            tag_value: surface
          - key: foot
            tag_value: foot
          - key: access
            tag_value: access
          - key: dog
            tag_value: dog
examples:
  - name: dog=unleashed area is off-leash
    input:
      source: osm
      geometry: polygon
      tags:
        leisure: park
        dog: unleashed
    output:
      - layer: offLeash
        geometry: polygon
        tags:
          level: off_leash
  - name: dog=designated area is off-leash
    input:
      source: osm
      geometry: polygon
      tags:
        dog: designated
    output:
      - layer: offLeash
        geometry: polygon
        tags:
          level: off_leash
  - name: dog park is fenced off-leash
    input:
      source: osm
      geometry: polygon
      tags:
        leisure: dog_park
    output:
      - layer: offLeash
        geometry: polygon
        tags:
          level: off_leash_fenced
  - name: dog park mapped as a node
    input:
      source: osm
      geometry: point
      tags:
        leisure: dog_park
    output:
      - layer: offLeash
        geometry: point
        tags:
          level: off_leash_fenced
  - name: dog=leashed
    input:
      source: osm
      geometry: polygon
      tags:
        dog: leashed
    output:
      - layer: offLeash
        geometry: polygon
        tags:
          level: leashed
  - name: dog=no on a footpath is a line
    input:
      source: osm
      geometry: line
      tags:
        highway: footway
        dog: no
    output:
      - layer: offLeash
        geometry: line
        tags:
          level: prohibited
      - layer: walk
        geometry: line
  - name: dog=yes is NEVER off-leash
    input:
      source: osm
      geometry: polygon
      tags:
        leisure: park
        dog: yes
    output:
      - layer: offLeash
        geometry: polygon
        tags:
          level: allowed_leash_unknown
  - name: explicit dog=leashed beats a dog park
    input:
      source: osm
      geometry: polygon
      tags:
        leisure: dog_park
        dog: leashed
    output:
      - layer: offLeash
        geometry: polygon
        tags:
          level: leashed
  - name: dog=no beats a dog park
    input:
      source: osm
      geometry: polygon
      tags:
        leisure: dog_park
        dog: no
    output:
      - layer: offLeash
        geometry: polygon
        tags:
          level: prohibited
  - name: a dog park beats dog=yes
    input:
      source: osm
      geometry: polygon
      tags:
        leisure: dog_park
        dog: yes
    output:
      - layer: offLeash
        geometry: polygon
        tags:
          level: off_leash_fenced
  - name: the invalid dog=off_leash value is ignored
    input:
      source: osm
      geometry: polygon
      tags:
        dog: off_leash
    output: []
  - name: forest is dense shade
    input:
      source: osm
      geometry: polygon
      tags:
        landuse: forest
    output:
      - layer: shade
        geometry: polygon
        tags:
          level: dense
  - name: wood is dense shade
    input:
      source: osm
      geometry: polygon
      tags:
        natural: wood
    output:
      - layer: shade
        geometry: polygon
        tags:
          level: dense
  - name: scrub is medium shade
    input:
      source: osm
      geometry: polygon
      tags:
        natural: scrub
    output:
      - layer: shade
        geometry: polygon
        tags:
          level: medium
  - name: tree row is a light-shade line
    input:
      source: osm
      geometry: line
      tags:
        natural: tree_row
    output:
      - layer: shade
        geometry: line
        tags:
          level: light
  - name: a forest that allows dogs off-leash is in both layers
    input:
      source: osm
      geometry: polygon
      tags:
        landuse: forest
        dog: unleashed
    output:
      - layer: shade
        geometry: polygon
        tags:
          level: dense
      - layer: offLeash
        geometry: polygon
        tags:
          level: off_leash
  - name: asphalt footway is high paw risk
    input:
      source: osm
      geometry: line
      tags:
        highway: footway
        surface: asphalt
    output:
      - layer: surface
        geometry: line
        tags:
          level: high
      - layer: walk
        geometry: line
  - name: compacted path is mid paw risk
    input:
      source: osm
      geometry: line
      tags:
        highway: path
        surface: compacted
    output:
      - layer: surface
        geometry: line
        tags:
          level: mid
      - layer: walk
        geometry: line
  - name: grass track is low paw risk
    input:
      source: osm
      geometry: line
      tags:
        highway: track
        surface: grass
    output:
      - layer: surface
        geometry: line
        tags:
          level: low
      - layer: walk
        geometry: line
  - name: a motorway surface is irrelevant
    input:
      source: osm
      geometry: line
      tags:
        highway: motorway
        surface: asphalt
    output: []
  - name: an unscored surface value draws nothing
    input:
      source: osm
      geometry: line
      tags:
        highway: path
        surface: moon_dust
    output:
      - layer: walk
        geometry: line
  - name: highway types are matched exactly (footpath is not path)
    input:
      source: osm
      geometry: line
      tags:
        highway: footpath
        surface: asphalt
    output: []
  - name: an ordinary pond is never drawn (unmonitored water, §6)
    input:
      source: osm
      geometry: polygon
      tags:
        natural: water
    output: []
  - name: an OSM swimming area is not an official bathing site
    input:
      source: osm
      geometry: point
      tags:
        leisure: swimming_area
    output: []
  - name: an official EU bathing site is "monitored", never "safe"
    input:
      source: eea_bathing
      geometry: point
      tags:
        bwid: NLBW07_VRL01
        name: DE VROLIJK
        category: Lake
        quality: Excellent
        quality_year: "2022"
    output:
      - layer: water
        geometry: point
        tags:
          level: monitored
  - name: the placeholder written when the EEA is unreachable is never drawn
    input:
      source: eea_bathing
      geometry: point
      tags:
        placeholder: "true"
    output: []
  - name: bench node
    input:
      source: osm
      geometry: point
      tags:
        amenity: bench
        backrest: yes
    output:
      - layer: benches
        geometry: point
  - name: bench mapped as a way becomes a point
    input:
      source: osm
      geometry: line
      tags:
        amenity: bench
    output:
      - layer: benches
        geometry: point
  - name: general bin
    input:
      source: osm
      geometry: point
      tags:
        amenity: waste_basket
    output:
      - layer: waste
        geometry: point
        tags:
          level: general
  - name: dog bin
    input:
      source: osm
      geometry: point
      tags:
        amenity: waste_basket
        waste: dog_excrement
    output:
      - layer: waste
        geometry: point
        tags:
          level: dog_bin
  - name: bag dispenser with no amenity tag
    input:
      source: osm
      geometry: point
      tags:
        vending: excrement_bags
    output:
      - layer: waste
        geometry: point
        tags:
          level: bag_dispenser
  - name: bag dispenser on a vending machine
    input:
      source: osm
      geometry: point
      tags:
        amenity: vending_machine
        vending: excrement_bags
    output:
      - layer: waste
        geometry: point
        tags:
          level: bag_dispenser
  - name: long-tail dog waste amenity
    input:
      source: osm
      geometry: point
      tags:
        amenity: dog_waste_bin
    output:
      - layer: waste
        geometry: point
        tags:
          level: dog_bin
  - name: drinking water
    input:
      source: osm
      geometry: point
      tags:
        amenity: drinking_water
    output:
      - layer: drinkingWater
        geometry: point
  - name: public toilets
    input:
      source: osm
      geometry: point
      tags:
        amenity: toilets
        fee: no
    output:
      - layer: toilets
        geometry: point
  - name: an unrelated shop is dropped
    input:
      source: osm
      geometry: point
      tags:
        shop: bakery
    output: []
  - name: an untagged footway is in the routing graph only
    input:
      source: osm
      geometry: line
      tags:
        highway: footway
    output:
      - layer: walk
        geometry: line
  - name: a motorway is never walkable
    input:
      source: osm
      geometry: line
      tags:
        highway: motorway
    output: []
